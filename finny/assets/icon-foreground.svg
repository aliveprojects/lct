    <path d="M330 590L214 566M330 626L214 640M694 590L810 566M694 626L810 640" stroke="#2B2540" stroke-width="12" stroke-linecap="round" opacity=".5"/>
    <!-- космический шлем -->
    <circle cx="512" cy="540" r="282" fill="rgba(170,215,255,.07)" stroke="#d7e9ff" stroke-width="18"/>
    <path d="M330 400Q380 320 470 298" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="512" cy="800" rx="236" ry="34" fill="#8fa4ff" stroke="#d7e9ff" stroke-width="14"/>
    <circle cx="352" cy="800" r="12" fill="#ffe066"/><circle cx="672" cy="800" r="12" fill="#ffe066"/>
