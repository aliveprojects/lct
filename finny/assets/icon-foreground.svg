    <circle cx="512" cy="540" r="250" fill="#8FE3B8"/>
    <circle cx="376" cy="600" r="46" fill="#F7A9B8" opacity=".9"/>
    <circle cx="648" cy="600" r="46" fill="#F7A9B8" opacity=".9"/>
