    <!-- монетка -->
    <g transform="translate(704 736)">
      <circle r="118" fill="#F5B301" stroke="#D18F00" stroke-width="20"/>
      <circle r="76" fill="none" stroke="#FFE07A" stroke-width="18"/>
      <path d="M-30 34L0 -40L30 34M-20 14H20" stroke="#B87700" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
